<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión — EsLoQueHay</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f9fafb;
        color: #374151;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .container {
        max-width: 320px;
      }
      .logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 1.5rem;
        opacity: 0.6;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #111827;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.5;
        color: #6b7280;
        margin-bottom: 1.5rem;
      }
      button {
        background: #de5a0e;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #c44d0c;
      }
      .offline-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        background: #fef3c7;
        color: #92400e;
        padding: 0.375rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 500;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="offline-badge">📡 Sin conexión</div>
      <img src="/logo.png" alt="EsLoQueHay" class="logo" />
      <h1>No hay internet</h1>
      <p>
        Parece que perdiste la conexión. Cuando vuelvas a estar online, podrás seguir creando
        experiencias gastronómicas.
      </p>
      <button onclick="window.location.reload()">Intentar de nuevo</button>
    </div>
  </body>
</html>
